# Named models and the role each one plays. Reasons and sources: docs/adr/0001-licensing.md.
# Prices and IDs were checked 2026-11-04. Confirm them again before a paid run.
roles:
  generator: qwen_generator
  verifier: deepseek
  teacher: deepseek
  judge: glm_judge
  baseline_cheap: haiku
  baseline_top: opus
  student: student
  zero_shot: zero_shot
cache_path: runs/llm_cache.sqlite
ledger_path: runs/cost_ledger.jsonl
models:
  deepseek:
    model_id: deepseek-v4-pro
    family: deepseek
    provider_class: open_weight
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # Peak prices. Off-peak is half: 00:00-01:00, 04:00-06:00 and 10:00-24:00 UTC on weekdays.
    input_per_mtok: 1.32
    output_per_mtok: 3.96
    # DeepSeek documents json_object and not json_schema, so parsing validates the schema.
    structured_mode: json_object
  qwen_generator:
    # Self-hosted (docker/compose.generator.yaml), so no host's terms apply. GPU time is the cost,
    # recorded through the run's GPU hours and not through this ledger.
    model_id: generator
    family: qwen
    provider_class: open_weight
    base_url: http://localhost:8002/v1
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  glm_judge:
    # GLM-5 weights through OpenRouter, with Z.ai excluded because of its terms. Evaluation only.
    # The model ID comes from a third-party listing, so confirm it on OpenRouter.
    model_id: z-ai/glm-5
    family: glm
    provider_class: open_weight
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    input_per_mtok: 1.00
    output_per_mtok: 3.20
    extra_body:
      provider:
        ignore: [z-ai]
        require_parameters: true
  haiku:
    model_id: claude-haiku-5-5
    family: claude
    provider_class: closed
    input_per_mtok: 0.10
    output_per_mtok: 0.50
  opus:
    model_id: claude-opus-5-5
    family: claude
    provider_class: closed
    input_per_mtok: 4.00
    output_per_mtok: 20.00
  student:
    # Our own vLLM server, using the adapter's served name.
    model_id: student
    family: student
    provider_class: open_weight
    base_url: http://localhost:8000/v1
    # Training disables thinking, so evaluation must too.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  zero_shot:
    model_id: base
    family: student
    provider_class: open_weight
    base_url: http://localhost:8000/v1
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
